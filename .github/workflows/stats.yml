name: Refresh public profile stats

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_stats.py
      - assets/portrait.txt
      - .github/workflows/stats.yml

permissions:
  contents: read

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check and refresh stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update_stats.py --check
          python3 scripts/update_stats.py
      - name: Save refreshed stats
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Refresh public profile stats'
          git pull --rebase origin main
          git push
